<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Queue drag demo</title>
    <link rel="stylesheet" href="/src/styles/globals.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      window.addEventListener("error", (e) => { document.getElementById("root").textContent = String(e.error?.stack || e.message); });
      window.addEventListener("unhandledrejection", (e) => { document.getElementById("root").textContent = String(e.reason?.stack || e.reason); });
      import("/src/fixtures/queue-drag.tsx").catch((e) => { document.getElementById("root").textContent = String(e.stack || e); });
    </script>
  </body>
</html>
