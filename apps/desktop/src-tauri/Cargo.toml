[package]
name = "brigadier-desktop"
description = "Brigadier desktop app: Tauri shell that launches and talks to brigadierd."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "brigadier"
path = "src/main.rs"

[build-dependencies]
cc = "=1.4.7"
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
blake3.workspace = true
brigadier-browser-data.workspace = true
brigadier-core.workspace = true
brigadier-ipc.workspace = true
brigadier-sandbox.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
tauri = { version = "2.11.6", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-updater = "2.12.0"
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
# The Browser tab's page: the wry release Tauri itself runs on (a second copy would clash).
wry = { version = "0.55.1", default-features = false }

# The Browser tab's own WebKit UI delegate (src/browser_ui.rs) and the first launch's window
# staging (src/intro.rs): the releases wry is built on.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSHTTPCookie", "NSKeyValueCoding", "NSSet", "NSString", "NSURL", "NSURLRequest", "NSUUID", "NSValue"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-quartz-core", "NSAnimation", "NSAnimationContext", "NSApplication", "NSBitmapImageRep", "NSButton", "NSColor", "NSControl", "NSEvent", "NSGraphics", "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSPasteboard", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSSavePanel", "NSScreen", "NSUserInterfaceItemIdentification", "NSView", "NSWindow", "NSWorkspace"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std", "CAMediaTimingFunction"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKFindConfiguration", "WKFindResult", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKOpenPanelParameters", "WKSecurityOrigin", "WKSnapshotConfiguration", "WKUIDelegate", "WKUserContentController", "WKWebView", "WKWebViewConfiguration", "WKHTTPCookieStore", "WKWebsiteDataRecord", "WKWebsiteDataStore", "WKWindowFeatures"] }
# Clears the startup blur, which Tauri's `set_effects(None)` leaves on macOS (the release Tauri
# applies it with).
window-vibrancy = "0.6.0"

[lints]
workspace = true
