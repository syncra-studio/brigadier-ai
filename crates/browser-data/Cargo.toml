[package]
name = "brigadier-browser-data"
description = "Finds other browsers' profiles and reads their cookies and history, once, for import."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aes = "0.9"
cbc = { version = "0.2", features = ["alloc"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rusqlite = { workspace = true, features = ["backup"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11"
sha2 = "0.11"
sysinfo.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
