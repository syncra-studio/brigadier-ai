[package]
name = "brigadier-sandbox"
description = "OS abstraction: sandbox, platform paths, credential storage, process spawn and shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3.workspace = true
dirs.workspace = true
thiserror.workspace = true
tracing.workspace = true
toml_edit = { version = "0.25.15", default-features = false, features = ["parse"] }
# Moving what Brigadier removes for the user (a Brain, the data directory, the app) to the Trash.
trash = "5.2.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
nix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_JobObjects",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
] }

[lints]
workspace = true
