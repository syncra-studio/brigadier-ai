[package]
name = "brigadier-core"
description = "Domain model, projections and the session manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
brigadier-brain.workspace = true
brigadier-cli.workspace = true
brigadier-git.workspace = true
brigadier-index.workspace = true
brigadier-providers.workspace = true
brigadier-registry.workspace = true
brigadier-router.workspace = true
brigadier-sandbox.workspace = true
brigadier-store.workspace = true
base64.workspace = true
blake3.workspace = true
futures-util = "0.3.32"
getrandom = "0.4.3"
globset = "0.4.20"
ignore = "0.4.33"
# MCP sign-ins: Claude Code's `mcp login` runs only in a terminal.
portable-pty = "0.9.0"
jiff = "0.2.37"
memchr.workspace = true
# Pages: noticing edits made to the pages folder by other programs.
notify = "8.2.0"
# A Word file attached to a Chat goes as its text.
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = { version = "0.13.5", features = ["json", "form", "stream"] }
rusqlite.workspace = true
rusqlite_migration.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "process", "io-util", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
toml = "1.1.6"
toml_edit = { version = "0.25.15", default-features = false, features = ["parse", "display"] }
tracing.workspace = true
ts-rs.workspace = true
uuid.workspace = true
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
pdf-extract = "0.12.1"
lopdf = { version = "0.42", default-features = false }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

# Computer use: whether the helper's daemon process still runs.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

# Previews: whether a starting desktop app opened its window yet.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow"] }
# The daemon owns its MCP OAuth grants.
security-framework = "3.7.0"

[lints]
workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }
