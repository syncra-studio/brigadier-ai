[package]
name = "brigadier-core"
description = "Domain model, projections and the session manager."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
brigadier-brain.workspace = true
brigadier-cli.workspace = true
brigadier-git.workspace = true
brigadier-index.workspace = true
brigadier-providers.workspace = true
brigadier-registry.workspace = true
brigadier-review.workspace = true
brigadier-router.workspace = true
brigadier-sandbox.workspace = true
brigadier-store.workspace = true
base64.workspace = true
blake3.workspace = true
getrandom = "0.4.3"
globset = "0.4.20"
# MCP sign-ins: the daemon's local proxy and the OAuth requests behind it.
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.11.0"
url = "2.5.8"
zeroize = "1.9.0"
ignore = "0.4.33"
jiff = "0.2.37"
memchr.workspace = true
# Pages: noticing edits made to the pages folder by other programs.
notify = "8.2.0"
# A Word file attached to a Chat goes as its text.
quick-xml = "0.42.0"
regex = "1.13.1"
rusqlite.workspace = true
rusqlite_migration.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "process", "io-util", "net"] }
tokio-util = { workspace = true, features = ["rt"] }
toml = "1.1.6"
tracing.workspace = true
ts-rs.workspace = true
uuid.workspace = true
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
pdf-extract = "0.12.1"
lopdf = { version = "0.42", default-features = false }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

# Previews: whether a starting desktop app opened its window yet.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGWindow"] }
# MCP sign-ins the agents and Brigadier keep in the Keychain.
core-foundation = "0.10.1"
security-framework = "3.7.0"

[lints]
workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["test-util"] }
