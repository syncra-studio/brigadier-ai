[package]
name = "brigadier-registry"
description = "MCP, plugin and skill registry with config importers and watchers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
# Headers in the order their config gives them, as Claude Code hashes them for its key.
serde_json = { workspace = true, features = ["preserve_order"] }
# The CLIs' keys for their stored MCP sign-ins.
sha2 = "0.11.0"
toml = "1.1.6"
tracing.workspace = true
yaml-rust2 = "0.13.0"

[lints]
workspace = true
