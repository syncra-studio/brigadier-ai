[package]
name = "brigadier-shell-native"
description = "What Brigadier's desktop shell does without any window toolkit: the daemon bridge, the opening policy, the browser's store. Built as a Node addon for the Electron shell with the napi feature."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
# Off by default: the addon's symbols resolve only inside Node, so nothing else may link them.
napi = ["dep:napi", "dep:napi-derive", "dep:napi-build", "dep:tracing-subscriber", "dep:sysinfo"]

[build-dependencies]
napi-build = { version = "=2.6.0", optional = true }

[dependencies]
brigadier-core.workspace = true
brigadier-ipc.workspace = true
brigadier-sandbox.workspace = true
napi = { version = "=3.16.1", default-features = false, features = ["napi8", "async", "tokio_rt"], optional = true }
napi-derive = { version = "=3.7.0", optional = true }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { workspace = true, optional = true }
tokio = { workspace = true, features = ["process", "sync", "time", "macros", "rt"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }

[lints]
workspace = true
