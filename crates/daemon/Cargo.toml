[package]
name = "brigadier-daemon"
description = "brigadierd: the Brigadier core process."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "brigadierd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
brigadier-core.workspace = true
brigadier-index.workspace = true
brigadier-ipc.workspace = true
brigadier-mcp-server.workspace = true
brigadier-providers.workspace = true
brigadier-sandbox.workspace = true
brigadier-store.workspace = true
interprocess = "2.4.4"
portable-pty = "0.9.0"
# Only to cap SQLite's memory for the whole process; the stores open their own connections.
rusqlite.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
# Dictation: the speech model's download and its check.
sha2 = "0.11.0"
sysinfo.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "process", "io-util"] }
tokio-metrics = "0.5.2"
tokio-util = { workspace = true, features = ["rt"] }
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# Dictation's speech engine (whisper.cpp), run in a short-lived `brigadierd transcribe`.
whisper-rs = "0.16.0"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
# Keeping the computer awake (SetThreadExecutionState).
windows-sys = { version = "0.61.2", features = ["Win32_System_Power"] }

[lints]
workspace = true
