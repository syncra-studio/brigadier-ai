[package]
name = "brigadier-cli"
description = "brigadier: the command a session calls to read and drive Brigadier, and its protocol."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "brigadier"
path = "src/main.rs"

[dependencies]
base64.workspace = true
brigadier-sandbox.workspace = true
interprocess = "2.4.4"
jiff = "0.2.37"
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# An MCP server's secrets (`brigadier secret`, `brigadier mcp run`).
security-framework = "3.7.0"

[lints]
workspace = true
