<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Electron Pad</title>
<style>
  body { font: 14px -apple-system, sans-serif; margin: 20px; }
  label { display: block; margin: 10px 0; }
  button { font-size: 14px; margin-right: 8px; }
</style>
</head>
<body>
<h1 style="font-size:18px">Sign-up</h1>
<label>Full name <input id="name" type="text"></label>
<label><input id="subscribe" type="checkbox"> Subscribe</label>
<button id="submit">Submit</button>
<button id="tap">Tap</button>
<p id="status" role="status">Not submitted</p>
<script>
  const $ = (id) => document.getElementById(id);
  let taps = 0, submitted = '';
  $('name').addEventListener('input', (e) => pad.log('name', 'text', e.target.value));
  $('subscribe').addEventListener('change', (e) => pad.log('subscribe', 'toggle', e.target.checked ? 'on' : 'off'));
  $('submit').addEventListener('click', () => {
    submitted = `${$('name').value}|${$('subscribe').checked ? 'on' : 'off'}`;
    $('status').textContent = 'Submitted';
    pad.log('submit', 'press', submitted);
  });
  $('tap').addEventListener('click', () => { taps += 1; pad.log('tap', 'press', taps); });
  pad.onSnapshot(() => ({
    name: $('name').value, subscribe: $('subscribe').checked ? 'on' : 'off',
    submitted, taps: String(taps),
  }));
</script>
</body>
</html>
