[package]
name = "brigadier-providers"
description = "Provider adapter trait and the claude, codex, ACP and OpenAI-compatible adapters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Only the `gen-codex` binding generator needs these.
codegen = ["dep:typify", "dep:schemars", "dep:syn", "dep:prettyplease"]

[dependencies]
aho-corasick = "1.1.5"
base64.workspace = true
brigadier-sandbox.workspace = true
brigadier-registry.workspace = true
dirs.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
# Naming Claude Code's Keychain item after its config dir (`login_mark`).
sha2 = "0.11.0"
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "time", "rt", "macros", "fs"] }
tracing.workspace = true
toml_edit = { version = "0.25.15", default-features = false, features = ["parse"] }
ts-rs.workspace = true
uuid = { workspace = true, features = ["v4"] }
which = "8.0.6"

prettyplease = { version = "0.3.0", optional = true }
schemars = { version = "0.8.22", optional = true }
syn = { version = "3.0.6", optional = true }
typify = { version = "0.8.0", optional = true }

[target.'cfg(unix)'.dependencies]
# Whether a CLI's process still runs (`kill(pid, 0)`).
nix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# When Claude Code's Keychain item last changed: its attributes only, never its data.
security-framework = "3.7.0"

[target.'cfg(windows)'.dependencies]
junction = "1.2.0"

[[bin]]
name = "gen-codex"
path = "src/bin/gen_codex.rs"
required-features = ["codegen"]

[lints]
workspace = true
