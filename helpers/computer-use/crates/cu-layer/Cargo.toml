[package]
name = "cu-layer"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Brigadier's behaviour on top of the vendored driver: target guard, never-front rules, restore policy and Brigadier's own tools."
publish = false

[dependencies]
cua-driver-core = { path = "../../upstream/crates/cua-driver-core" }
async-trait = "0.1"
anyhow = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { path = "../../upstream/crates/platform-macos" }
cursor-overlay = { path = "../../upstream/crates/cursor-overlay" }
core-foundation = "0.10"
objc2-foundation = { version = "0.2", features = [
    "NSArray", "NSBundle", "NSDate", "NSDictionary", "NSNotification", "NSOperation",
    "NSString", "NSURL", "block2",
    # launch_app's own LaunchServices calls.
    "NSAppleEventDescriptor", "NSError",
] }
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSRunningApplication", "NSWorkspace"] }
objc2 = "0.5"
block2 = "0.5"
libc = "0.2"
# The page tool's debugging-port client.
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Plans glides in a test of the saved cursor motion.
cua-cursor-motion = { path = "../../upstream/crates/cua-cursor-motion" }
# Runs the page-field probe against a small stand-in page (the driver
# already builds this engine).
rquickjs = { version = "0.14", default-features = false, features = ["std"] }

[build-dependencies]
cc = "1"

[lints]
workspace = true
