[package]
name = "cu-core"
version.workspace = true
edition.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
time = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
async-trait = "0.1"
# Used by the shared `image_utils` module — pure PNG/JPEG/resize/crosshair
# helpers extracted from `platform-{macos,windows,linux}/src/capture.rs` so
# all three platforms call the same code path.
image = { workspace = true }

[dev-dependencies]
tempfile = "3"

# Used by `cursor_sampler::sample_cursor` to poll the OS mouse position
# during video recording. Same version as platform-windows uses to avoid
# a duplicate crate version.

[lints]
workspace = true
