[package]
name = "cu-testkit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared harness for brigadier-cu integration tests: MCP/CLI transports, child reaping, path + response helpers. Dev-dependency only — never shipped."
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2-app-kit = { version = "0.2", features = [
    "NSApplication",
    "NSRunningApplication",
    "NSWorkspace",
    "libc",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_Graphics_Gdi", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[lints]
workspace = true
