[package]
name = "brigadier-cu"
version.workspace = true
edition.workspace = true
description = "Cross-platform background computer-use automation daemon (MCP server)"
default-run = "brigadier-cu"

[[bin]]
name = "brigadier-cu"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
cu-core = { path = "../cu-core" }
cursor-overlay = { path = "../cursor-overlay" }
pip-preview = { path = "../pip-preview" }
async-trait = "0.1"
base64 = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
subtle = "2"
sha2 = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }

# Used by crate::bundle::parent_is_not_launchd() for the TCC
# auto-relaunch detection path on Unix (only the macOS heuristic
# actually fires, but the crate compiles on Linux too).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { path = "../platform-macos" }
core-foundation = "0.10"
# The permissions panel and the AppKit main loop.
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSArray", "NSBundle", "NSString", "NSDictionary", "NSRunLoop",
    "NSThread", "NSObject", "NSValue", "NSGeometry", "NSDate", "NSNotification",
] }
# The live screen-capture readiness probe; the same version the old driver
# crate uses until the switch.
screencapturekit = { version = "6", features = ["macos_15_0"] }


[dev-dependencies]
# Shared integration-test harness (MCP/CLI transports, child reaping, paths,
# response accessors). Dev-only — never linked into the shipped driver.
cu-testkit = { path = "../cu-testkit" }
tokio = { workspace = true, features = ["full"] }
base64 = { workspace = true }
# Isolated HOME / cache directories for `version_check` unit tests so they
# never touch the developer's real `~/.brigadier-cu/version_check.json`.
tempfile = "3"

[lints]
workspace = true
