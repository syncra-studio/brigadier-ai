[package]
name = "brigadier-cu"
version.workspace = true
edition.workspace = true
description = "Cross-platform background computer-use automation daemon (MCP server)"
default-run = "brigadier-cu"

[[bin]]
name = "brigadier-cu"
path = "src/main.rs"

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
cua-driver-core = { path = "../../upstream/crates/cua-driver-core" }
cu-layer = { path = "../cu-layer" }
async-trait = "0.1"
base64 = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
subtle = "2"
sha2 = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }

# Used by crate::bundle::parent_is_not_launchd() for the TCC
# auto-relaunch detection path on Unix (only the macOS heuristic
# actually fires, but the crate compiles on Linux too).
cursor-overlay = { path = "../../upstream/crates/cursor-overlay" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { path = "../../upstream/crates/platform-macos" }
core-foundation = "0.10"
# The permissions panel and the AppKit main loop.
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSArray", "NSBundle", "NSString", "NSDictionary", "NSRunLoop",
    "NSThread", "NSObject", "NSValue", "NSGeometry", "NSDate", "NSNotification",
] }
# The live screen-capture readiness probe; the same version the driver uses
# (both link the same bridge symbols, so only one version may be linked).
screencapturekit = { version = "8.0.1", features = ["macos_15_0"] }


[dev-dependencies]
# Test-home exit cleanup uses the C runtime on Windows too.
libc = "0.2"
tokio = { workspace = true, features = ["full"] }
base64 = { workspace = true }
# Isolated HOME / cache directories for `version_check` unit tests so they
# never touch the developer's real `~/.brigadier-cu/version_check.json`.
tempfile = "3"

[target.'cfg(target_os = "macos")'.dev-dependencies]
# The desktop integration harness currently only implements macOS.
cu-testkit = { path = "../cu-testkit" }

[lints]
workspace = true
