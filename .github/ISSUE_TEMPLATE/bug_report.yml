name: Bug report
description: Something Brigadier does wrong, reproduced on the latest main.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        One bug per issue. Read [CONTRIBUTING.md](https://github.com/syncra-studio/brigadier-ai/blob/main/CONTRIBUTING.md#issues) first.
        Security problems go to [a private report](https://github.com/syncra-studio/brigadier-ai/security/advisories/new), never here.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you file
      options:
        - label: I reproduced this on the latest `main` (or the latest release).
          required: true
        - label: I searched open and closed issues and found no duplicate.
          required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Settings › General › About, or `git rev-parse --short HEAD` for a source build.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS and version, and the agent CLIs with their versions (`claude --version`, `codex --version`).
      placeholder: macOS 27.0, Claude Code 2.1.x, codex-cli 0.16x
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Sessions, workers, landing or review
        - Chats
        - Overnight runs
        - Accounts, usage or routing
        - Computer use
        - Built-in browser
        - Terminal, files or source
        - Dictation or read aloud
        - Settings, onboarding or uninstall
        - Build from source
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps from a fresh start. Include the permission level and the prompt, if any.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and screenshots
      description: Relevant lines only. Remove anything private (paths, emails, tokens) first.
      render: text
  - type: textarea
    id: ruled-out
    attributes:
      label: What you already ruled out
  - type: input
    id: ai
    attributes:
      label: AI assistance
      description: If an AI tool wrote any of this report, name it. You must still have reproduced the bug yourself.
      placeholder: None
