name: Continuity battery

# Invoked nightly even when the app build has no new commit. A hand-started battery never
# builds, signs or publishes the app. Measurements and regressions cannot hold a session.
on:
  workflow_call:
    inputs:
      arms:
        description: "Comma-separated arms to run: seam, plain, zed, summary"
        type: string
        default: seam,plain,zed
  workflow_dispatch:
    inputs:
      arms:
        description: "Comma-separated arms to run: seam, plain, zed, summary"
        type: string
        default: seam,plain,zed
      zed_long:
        description: "Run the zed arm's long recall + decisions profiles too (default: short only)"
        type: boolean
        default: false

      runner:
        description: "Runner (presets and dry_run select experiment automatically)"
        type: choice
        options: [legacy, experiment]
        default: legacy
      profile:
        description: "Experiment profile; legacy scenarios use --fair at 200k"
        type: choice
        options: [work, endurance, recall-short, recall-long, updates-short, updates-long, decisions-short, decisions-long]
        default: work
      providers:
        description: "Experiment providers (presets override this)"
        type: choice
        options: [claude, codex, both]
        default: both
      repetitions:
        description: "Independent experiment lineages per arm (presets override this)"
        type: number
        default: 1
      preset:
        description: "Fixed experiment matrix (overrides arms/profile/providers/repetitions); pilot excludes P5"
        type: choice
        options: [none, stage0, pilot]
        default: none
      dry_run:
        description: "Plan only: no provider secrets, CLIs, build or model calls"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: continuity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  selection:
    name: Select battery arms
    if: github.ref == 'refs/heads/main' && inputs.runner != 'experiment' && !inputs.dry_run && (!inputs.preset || inputs.preset == 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.arms.outputs.matrix }}
      arms: ${{ steps.arms.outputs.arms }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate requested arms
        id: arms
        env:
          ARMS: ${{ inputs.arms }}
        run: |
          python3 -B - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'tools/continuity-battery')
          from nightly import parse_arms
          arms = parse_arms(os.environ['ARMS'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'matrix={json.dumps(arms)}\n')
              output.write(f'arms={",".join(arms)}\n')
          PY

  provider:
    name: ${{ matrix.provider }} / ${{ matrix.arm }}
    needs: selection
    if: github.ref == 'refs/heads/main' && inputs.runner != 'experiment' && !inputs.dry_run && (!inputs.preset || inputs.preset == 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        provider: [claude, codex]
        arm: ${{ fromJSON(needs.selection.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
    steps:
      - uses: actions/checkout@v7
      - name: Existing credentials only
        id: credentials
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          if { [ "$PROVIDER" = claude ] && { [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ]; }; } ||
             { [ "$PROVIDER" = codex ] && [ -n "$CODEX_AUTH_JSON" ]; }; then
            echo 'live=true' >> "$GITHUB_OUTPUT"
          else
            echo 'live=false' >> "$GITHUB_OUTPUT"
            echo '::notice::needs the user: secrets'
          fi
      - uses: actions/setup-node@v7
        if: steps.credentials.outputs.live == 'true'
        with:
          node-version: 24
      - name: Provider CLI
        if: steps.credentials.outputs.live == 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
          ARM: ${{ matrix.arm }}
        run: |
          if [ "$PROVIDER" = claude ]; then
            npm install -g @anthropic-ai/claude-code
          fi
          if [ "$PROVIDER" = codex ] || { [ "$ARM" = seam ] && [ -n "$CODEX_AUTH_JSON" ]; }; then
            npm install -g @openai/codex
            python3 - <<'PY'
          import os
          from pathlib import Path
          home = Path(os.environ['RUNNER_TEMP']) / 'continuity-codex'
          home.mkdir(mode=0o700)
          auth = home / 'auth.json'
          auth.write_text(os.environ['CODEX_AUTH_JSON'])
          auth.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'CODEX_HOME={home}\n')
          PY
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.credentials.outputs.live == 'true'
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        if: steps.credentials.outputs.live == 'true'
        with:
          shared-key: continuity
      - name: Build existing headless harness
        if: steps.credentials.outputs.live == 'true'
        run: |
          df -h .
          sudo apt-get update
          sudo apt-get install -y libssl-dev libclang-dev cmake
          cargo build --locked -p brigadier-daemon --bin brigadierd -p brigadier-cli --bin brigadier
      - name: Battery and decision survival
        if: always()
        env:
          LIVE: ${{ steps.credentials.outputs.live }}
          PROVIDER: ${{ matrix.provider }}
          ARM: ${{ matrix.arm }}
          ZED_LONG: ${{ github.event.inputs.zed_long == 'true' }}
        run: |
          args=()
          if [ "$LIVE" = true ]; then args+=(--live); fi
          if [ "$ZED_LONG" = true ]; then args+=(--zed-long); fi
          python3 tools/continuity-battery/nightly.py provider --provider "$PROVIDER" --arm "$ARM" \
            --output "$RUNNER_TEMP/continuity-provider-$PROVIDER-$ARM" "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: continuity-provider-${{ matrix.provider }}-${{ matrix.arm }}
          path: ${{ runner.temp }}/continuity-provider-${{ matrix.provider }}-${{ matrix.arm }}
          if-no-files-found: error
          retention-days: 30

  weekly:
    name: Opted-in real lineages
    if: github.ref == 'refs/heads/main' && inputs.runner != 'experiment' && !inputs.dry_run && (!inputs.preset || inputs.preset == 'none')
    # An opt-in runner can read its own real sessions. No home directory is ever scanned.
    runs-on: ${{ fromJSON(vars.CONTINUITY_LINEAGE_RUNNER || '"ubuntu-24.04"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Weekly sample (Sunday, or a manual first sample)
        env:
          RECORDS: ${{ vars.CONTINUITY_RECORD_ROOTS }}
          OPTED_RUNNER: ${{ vars.CONTINUITY_LINEAGE_RUNNER }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/continuity-battery')
          from lineages import sample
          if datetime.datetime.now(datetime.timezone.utc).weekday() != 6 and os.environ['MANUAL'] != 'true':
              report = {'status': 'skipped', 'reason': 'weekly sample not due'}
          elif not os.environ['OPTED_RUNNER']:
              report = sample([])
          else:
              report = sample(json.loads(os.environ['RECORDS'] or '[]'))
          Path(os.environ['RUNNER_TEMP'], 'weekly.json').write_text(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: continuity-weekly
          path: ${{ runner.temp }}/weekly.json
          retention-days: 30

  report:
    name: Artifact and regression issue
    needs: [selection, provider, weekly]
    if: always() && github.ref == 'refs/heads/main' && inputs.runner != 'experiment' && !inputs.dry_run && (!inputs.preset || inputs.preset == 'none')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: continuity-*
          path: ${{ runner.temp }}/continuity-input
      - name: Previous artifact (the first run is the baseline)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=continuity-battery&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")] | sort_by(.id) | last | .workflow_run.id // empty')"
          if [ -n "$run" ]; then
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n continuity-battery -D "$RUNNER_TEMP/continuity-previous"
          fi
      - name: Summarize measurements
        if: always()
        env:
          ARMS: ${{ needs.selection.outputs.arms || inputs.arms }}
        run: |
          python3 tools/continuity-battery/nightly.py collect --input "$RUNNER_TEMP/continuity-input" \
            --output "$RUNNER_TEMP/continuity-report" --previous "$RUNNER_TEMP/continuity-previous/summary.json" \
            --arms "$ARMS"
          cat "$RUNNER_TEMP/continuity-report/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: continuity-battery
          path: ${{ runner.temp }}/continuity-report
          if-no-files-found: error
          retention-days: 90
      - name: Open or update a regression issue (never a gate)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/continuity-battery')
          from nightly import issue
          issue(json.loads(Path(os.environ['RUNNER_TEMP'], 'continuity-report/summary.json').read_text()))
          PY

  experiment-plan:
    name: Plan experiment (no credentials or model calls)
    if: github.ref == 'refs/heads/main' && (inputs.runner == 'experiment' || inputs.dry_run || (inputs.preset && inputs.preset != 'none'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Expand and price matrix before any model call
        id: plan
        env:
          PRESET: ${{ inputs.preset || 'none' }}
          PROFILE: ${{ inputs.profile || 'work' }}
          ARMS: ${{ inputs.arms }}
          PROVIDERS: ${{ inputs.providers || 'both' }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          python3 -B tools/continuity-battery/dispatch.py plan --dry-run \
            --preset "$PRESET" --profile "$PROFILE" --arms "$ARMS" \
            --providers "$PROVIDERS" --repetitions "$REPETITIONS" \
            --output "$RUNNER_TEMP/continuity-experiment-plan"
      - uses: actions/upload-artifact@v7
        with:
          name: continuity-experiment-plan
          path: ${{ runner.temp }}/continuity-experiment-plan
          retention-days: 30

  experiment:
    name: Experiment / ${{ matrix.id }}
    needs: experiment-plan
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.experiment-plan.outputs.matrix) }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
    steps:
      - uses: actions/checkout@v7
      - name: Existing credentials only
        id: credentials
        env:
          PROVIDER: ${{ matrix.provider }}
        run: |
          if { [ "$PROVIDER" = claude ] && { [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || [ -n "$ANTHROPIC_API_KEY" ]; }; } ||
             { [ "$PROVIDER" = codex ] && [ -n "$CODEX_AUTH_JSON" ]; }; then
            echo 'live=true' >> "$GITHUB_OUTPUT"
          else
            echo 'live=false' >> "$GITHUB_OUTPUT"
            echo '::notice::needs the user: secrets'
          fi
      - uses: actions/setup-node@v7
        if: steps.credentials.outputs.live == 'true'
        with:
          node-version: 24
      - name: Provider CLI
        if: steps.credentials.outputs.live == 'true'
        env:
          PROVIDER: ${{ matrix.provider }}
          ARM: ${{ matrix.arm }}
        run: |
          if [ "$PROVIDER" = claude ]; then
            npm install -g @anthropic-ai/claude-code
          fi
          if [ "$PROVIDER" = codex ] || { [ "$ARM" = seam ] && [ -n "$CODEX_AUTH_JSON" ]; }; then
            npm install -g @openai/codex
            python3 - <<'PY'
          import os
          from pathlib import Path
          home = Path(os.environ['RUNNER_TEMP']) / 'continuity-codex'
          home.mkdir(mode=0o700)
          auth = home / 'auth.json'
          auth.write_text(os.environ['CODEX_AUTH_JSON'])
          auth.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'CODEX_HOME={home}\n')
          PY
          fi
      - uses: dtolnay/rust-toolchain@master
        if: steps.credentials.outputs.live == 'true'
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@v2
        if: steps.credentials.outputs.live == 'true'
        with:
          shared-key: continuity
      - name: Build existing headless harness
        if: steps.credentials.outputs.live == 'true'
        run: |
          df -h .
          sudo apt-get update
          sudo apt-get install -y libssl-dev libclang-dev cmake
          cargo build --locked -p brigadier-daemon --bin brigadierd -p brigadier-cli --bin brigadier
      - name: Run planned lineage
        if: always()
        env:
          LIVE: ${{ steps.credentials.outputs.live }}
          CELL: ${{ toJSON(matrix) }}
          CELL_ID: ${{ matrix.id }}
        run: |
          args=()
          if [ "$LIVE" = true ]; then args+=(--live); fi
          export BRIGADIER_BATTERY_EVIDENCE_DIR="$RUNNER_TEMP/continuity-private"
          python3 -B tools/continuity-battery/dispatch.py run \
            --output "$RUNNER_TEMP/continuity-experiment-cell-$CELL_ID" "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: continuity-experiment-cell-${{ matrix.id }}
          path: ${{ runner.temp }}/continuity-experiment-cell-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 30

  experiment-report:
    name: Experiment public results
    needs: [experiment-plan, experiment]
    if: always() && needs.experiment-plan.result == 'success' && !inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: continuity-experiment-cell-*
          path: ${{ runner.temp }}/continuity-experiment-input
      - uses: actions/download-artifact@v8
        with:
          name: continuity-experiment-plan
          path: ${{ runner.temp }}/continuity-experiment-input/plan
      - name: Collect public measurements only
        run: |
          python3 -B tools/continuity-battery/dispatch.py collect \
            --input "$RUNNER_TEMP/continuity-experiment-input" \
            --output "$RUNNER_TEMP/continuity-experiment-report"
          cat "$RUNNER_TEMP/continuity-experiment-report/report.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: continuity-experiment
          path: ${{ runner.temp }}/continuity-experiment-report
          if-no-files-found: error
          retention-days: 90
