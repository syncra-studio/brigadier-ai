name: CI

# Every push to main and every pull request: formatting, bindings, typecheck and lint, the app's
# and the Rust workspace's tests, Linux and Windows clippy, and the Linux app's build and launch
# smoke check, in parallel jobs.
# The macOS and Windows builds and their smoke checks run nightly (nightly.yml), which also runs
# on release tags.
#
# Docs, the license and the repository's community files (issue forms, CODEOWNERS, the PR gate,
# the nightly workflow) don't affect this run, so a push that changes only those skips it.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
      - .github/CODEOWNERS
      - .github/workflows/pr-gate.yml
      - .github/workflows/nightly.yml
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
      - .github/CODEOWNERS
      - .github/workflows/pr-gate.yml
      - .github/workflows/nightly.yml
  workflow_dispatch:

# A push cancels an older push's run, never a run someone started by hand.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"
  # Debug builds only serve clippy and the tests; omit their symbols to cut compile and cache I/O.
  CARGO_PROFILE_DEV_DEBUG: "0"
  # Shared runners are noisy neighbours. The smoke check multiplies timing budgets (cold start,
  # ingest to paint, frame gaps, the stall threshold) by this factor; size budgets such as core
  # idle RSS are never relaxed. Locally the factor is 1.
  BRIGADIER_BUDGET_TOLERANCE: "3"

jobs:
  checks:
    name: Format, bindings, typecheck, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Generated TypeScript bindings are current
        run: |
          cargo run --locked -q -p brigadier-ipc --bin gen-ts
          git diff --exit-code -- apps/desktop/src/ipc/generated
          test -z "$(git status --porcelain -- apps/desktop/src/ipc/generated)"
      - name: Continuity report and sampler tests (no live calls)
        run: python3 -B -m unittest discover -s tools/continuity-battery -p 'test_*.py' -v
      - run: pnpm typecheck
      - name: Lint, the style check (tokens and src/components only), tokens in step with Pen
        run: pnpm lint

  app-tests:
    name: App tests
    runs-on: ubuntu-24.04
    # A whole run takes 11 to 15 minutes; a file failing once is run again (#85), and that must fit.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm -C apps/desktop test:charts

  clippy:
    name: Clippy (${{ matrix.name }})
    # Each platform's clippy sees the code gated to it: dead code under another platform's cfg
    # shows up only here.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
            # A cold clippy is ~10 min; a slow apt mirror can add up to 12 more.
            timeout-minutes: 30
          - name: Windows
            os: windows-latest
            # Clippy itself finishes in ~15 min, but saving the Rust cache off the Dev Drive has
            # twice taken the whole job past a 25-minute limit and been cancelled mid-save (#518).
            timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout-minutes }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Windows Cargo files on ReFS
        if: runner.os == 'Windows'
        uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4
        with:
          # Native Dev Drives need at least 50 GB. A dynamic disk uses only the space written.
          drive-size: 64GB
          drive-type: Dynamic
          drive-format: ReFS
          mount-path: ${{ github.workspace }}/../dev-drive
          env-mapping: |
            CARGO_HOME,{{ DEV_DRIVE }}/.cargo
            CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target
      - name: Restore apt packages
        if: runner.os == 'Linux'
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-cache
          key: apt-${{ runner.os }}-${{ runner.arch }}-libwebkit2gtk-4.1-dev-build-essential-libxdo-dev-libssl-dev-libayatana-appindicator3-dev-librsvg2-dev
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 12
        run: |
          # Outside the checkout: rust-cache walks the workspace and fails on apt's root-only partial/.
          archives="$RUNNER_TEMP/apt-cache"
          mkdir -p "$archives"
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives="$archives")
          packages=(libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev)
          # The Azure mirror sometimes takes ~10 s a package. Finished downloads stay in $archives,
          # so a capped attempt keeps its progress, and the next one uses archive.ubuntu.com.
          for i in 1 2 3; do
            sudo timeout 60 apt-get "${apt_opts[@]}" update && \
              sudo timeout 150 apt-get "${apt_opts[@]}" install -y --download-only "${packages[@]}" && break
            echo "apt download attempt $i failed, switching to archive.ubuntu.com and retrying..."
            sudo grep -rlZ azure.archive.ubuntu.com /etc/apt | xargs -0r sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' || true
            sleep 5
          done
          sudo apt-get "${apt_opts[@]}" install -y "${packages[@]}"
          # apt leaves a root-only partial/ and lock behind; actions/cache must be able to read it all.
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
      - name: Save apt packages
        # Saved now, not at job end, so a cancelled or timed-out job still fills the cache.
        if: runner.os == 'Linux' && steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy-${{ matrix.name }}
          # Mount beside the checkout so this stays relative to the Cargo workspace.
          # The cache saves files before setup-dev-drive's post step dismounts the volume.
          workspaces: . -> ${{ runner.os == 'Windows' && '../dev-drive/target' || 'target' }}
          # Pull requests restore the base branch cache without uploading a branch-only copy.
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Clippy (whole workspace, including the app shell)
        run: |
          pnpm build
          pnpm --filter @brigadier/desktop stage-sidecar --debug
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Windows Connect and project setup tests
        if: runner.os == 'Windows'
        # Connect's fakes use the real PowerShell runner and the daemon staged above as the
        # BROWSER link catcher. No vendor install, account, network request or browser opens.
        run: |
          cargo test --locked -p brigadier-daemon --bin brigadierd connect::windows_tests -- --test-threads=1 --nocapture
          cargo test --locked -p brigadier-providers claude::files::windows::windows_tests -- --test-threads=1 --nocapture
      - name: Windows browser capture tests
        if: runner.os == 'Windows'
        run: |
          cargo test --locked -p brigadier-desktop --bin brigadier-app browser_agent:: -- --test-threads=1 --nocapture

  rust-tests:
    name: Rust tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Restore apt packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-cache
          key: apt-${{ runner.os }}-${{ runner.arch }}-libwebkit2gtk-4.1-dev-build-essential-libxdo-dev-libssl-dev-libayatana-appindicator3-dev-librsvg2-dev-xfsprogs
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-
      - name: Linux system dependencies
        timeout-minutes: 12
        run: |
          # Outside the checkout: rust-cache walks the workspace and fails on apt's root-only partial/.
          archives="$RUNNER_TEMP/apt-cache"
          mkdir -p "$archives"
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives="$archives")
          packages=(libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xfsprogs)
          # The Azure mirror sometimes takes ~10 s a package. Finished downloads stay in $archives,
          # so a capped attempt keeps its progress, and the next one uses archive.ubuntu.com.
          for i in 1 2 3; do
            sudo timeout 60 apt-get "${apt_opts[@]}" update && \
              sudo timeout 150 apt-get "${apt_opts[@]}" install -y --download-only "${packages[@]}" && break
            echo "apt download attempt $i failed, switching to archive.ubuntu.com and retrying..."
            sudo grep -rlZ azure.archive.ubuntu.com /etc/apt | xargs -0r sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' || true
            sleep 5
          done
          sudo apt-get "${apt_opts[@]}" install -y "${packages[@]}"
          # apt leaves a root-only partial/ and lock behind; actions/cache must be able to read it all.
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
      - name: Save apt packages
        # Saved now, not at job end, so a cancelled or timed-out job still fills the cache.
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-tests
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests
        # The app shell's build script wants the built frontend and the daemon beside it. The
        # tests commit with git, which on Linux has no fallback identity as on a Mac. Nextest's
        # ci profile (.config/nextest.toml) kills a test hung for two minutes and tries a failed
        # one once more.
        run: |
          git config --global user.name "Brigadier CI"
          git config --global user.email ci@brigadier.invalid
          pnpm build
          pnpm --filter @brigadier/desktop stage-sidecar --debug
          cargo nextest run --locked --profile ci --workspace --lib --bins --tests
      - name: Copy-on-write tests on a file system that shares blocks
        # The runner's ext4 can't make copy-on-write copies, so the tests of copying a checkout's
        # caches into a worktree skip in the step above (issue #110). Here they run with their
        # temporary folders on XFS, which can.
        run: |
          truncate -s 4G "$RUNNER_TEMP/reflink.img"
          mkfs.xfs -q -m reflink=1 "$RUNNER_TEMP/reflink.img"
          sudo mkdir -p /mnt/reflink
          sudo mount -o loop "$RUNNER_TEMP/reflink.img" /mnt/reflink
          sudo chown "$(id -u):$(id -g)" /mnt/reflink
          echo probe > /mnt/reflink/probe
          cp --reflink=always /mnt/reflink/probe /mnt/reflink/probe-copy
          TMPDIR=/mnt/reflink cargo nextest run --locked --profile ci -p brigadier-core -p brigadier-sandbox --lib \
            -E 'test(/^manager::warm::/) | test(/^manager::flow::warm_session_tests::/) | test(/^clone::/)'

  linux-app:
    name: Linux app, launch smoke check
    runs-on: ubuntu-24.04
    # Warm builds take up to ~18 min and a cold one about half as long again; a slow apt mirror
    # can add up to 12 more.
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write
    env:
      # Keep release optimizations, but avoid cross-crate LTO and parallelize code generation.
      # Cargo passes these settings to the app and its sidecar builds alike.
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@v7
      - name: Restore apt packages
        id: apt-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/apt-cache
          key: apt-${{ runner.os }}-${{ runner.arch }}-libwebkit2gtk-4.1-dev-build-essential-curl-wget-file-libxdo-dev-libssl-dev-libayatana-appindicator3-dev-librsvg2-dev-xvfb-dbus
          restore-keys: apt-${{ runner.os }}-${{ runner.arch }}-
      - name: Linux system dependencies
        timeout-minutes: 12
        run: |
          # Outside the checkout: rust-cache walks the workspace and fails on apt's root-only partial/.
          archives="$RUNNER_TEMP/apt-cache"
          mkdir -p "$archives"
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives="$archives")
          packages=(libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus)
          # The Azure mirror sometimes takes ~10 s a package. Finished downloads stay in $archives,
          # so a capped attempt keeps its progress, and the next one uses archive.ubuntu.com.
          for i in 1 2 3; do
            sudo timeout 60 apt-get "${apt_opts[@]}" update && \
              sudo timeout 150 apt-get "${apt_opts[@]}" install -y --download-only "${packages[@]}" && break
            echo "apt download attempt $i failed, switching to archive.ubuntu.com and retrying..."
            sudo grep -rlZ azure.archive.ubuntu.com /etc/apt | xargs -0r sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' || true
            sleep 5
          done
          sudo apt-get "${apt_opts[@]}" install -y "${packages[@]}"
          # apt leaves a root-only partial/ and lock behind; actions/cache must be able to read it all.
          sudo rm -rf "$archives/partial" "$archives/lock"
          sudo chown -R "$(id -u):$(id -g)" "$archives"
      - name: Save apt packages
        # Saved now, not at job end, so a cancelled or timed-out job still fills the cache.
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/apt-cache
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-app
          save-if: ${{ github.event_name != 'pull_request' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the app bundle
        # Both packages in one build, as stage-sidecar's build of the daemon: the workspace
        # compiles once for the two.
        run: pnpm tauri build --bundles deb -- -p brigadier-desktop -p brigadier-daemon
      - name: Launch smoke check
        run: |
          set -o pipefail
          tools/ci/smoke.sh target/release/brigadier-app 2>&1 | tee "$RUNNER_TEMP/smoke.log"
      - name: Smoke report
        if: always()
        run: cat "${{ runner.temp }}/smoke-report.json" || echo "no smoke report was written"
      - name: Perf regression report (never a gate)
        # §5 of docs/STRIP-DOWN-PLAN.md: benchmarks are a report, not a gate. Only main's own
        # pushes file or update the tracking issue; a PR run just prints the lines above.
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          lines="$(grep '^PERF REGRESSION:' "$RUNNER_TEMP/smoke.log" || true)"
          if [ -z "$lines" ]; then
            echo "No perf regressions."
            exit 0
          fi
          metrics="$(printf '%s\n' "$lines" | sed -E 's/^PERF REGRESSION: (.*) [^ ]+ vs limit .*/\1/' | sort -u | paste -sd, -)"
          title="Nightly perf regression: $metrics"
          repo="$GITHUB_REPOSITORY"
          found="$(gh issue list -R "$repo" --state open --search "$title in:title" --json number,title)"
          open="$(echo "$found" | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -n1)"
          body="$RUN_URL"$'\n\n'"$lines"
          if [ -n "$open" ]; then
            gh issue comment "$open" -R "$repo" --body "$body"
          else
            gh issue create -R "$repo" --title "$title" --body "$body"
          fi
      - name: No processes left behind
        if: always()
        run: |
          sleep 2
          if pgrep -fl brigadierd; then
            echo "brigadierd is still running"; exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-report-Linux
          path: ${{ runner.temp }}/smoke-report.json
          if-no-files-found: warn
