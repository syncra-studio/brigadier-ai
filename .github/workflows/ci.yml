name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  workflow_dispatch:

# A push cancels an older push's run, never a run someone started by hand.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.98.1"
  # Shared runners are noisy neighbours. The smoke check multiplies timing budgets (cold start,
  # ingest to paint, frame gaps, the stall threshold) by this factor; size budgets such as core
  # idle RSS are never relaxed. Locally the factor is 1.
  BRIGADIER_BUDGET_TOLERANCE: "3"

jobs:
  checks:
    name: Format, bindings, typecheck, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Generated TypeScript bindings are current
        run: |
          cargo run --locked -q -p brigadier-ipc --bin gen-ts
          git diff --exit-code -- apps/desktop/src/ipc/generated
          test -z "$(git status --porcelain -- apps/desktop/src/ipc/generated)"
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  build:
    name: Build, clippy, smoke (${{ matrix.name }})
    needs: checks
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Release tags build the universal app and DMG; other runs the native (arm64) app,
          # which compiles once instead of twice.
          - name: macOS
            os: macos-latest
            rust-targets: ${{ startsWith(github.ref, 'refs/tags/v') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
            tauri-args: ${{ startsWith(github.ref, 'refs/tags/v') && '--target universal-apple-darwin --bundles app,dmg' || '--bundles app' }}
            app: ${{ startsWith(github.ref, 'refs/tags/v') && 'target/universal-apple-darwin/release/bundle/macos/Brigadier.app/Contents/MacOS/brigadier' || 'target/release/bundle/macos/Brigadier.app/Contents/MacOS/brigadier' }}
          - name: Windows
            os: windows-latest
            rust-targets: ""
            tauri-args: --bundles nsis
            app: target/release/brigadier.exe
          - name: Linux
            os: ubuntu-24.04
            rust-targets: ""
            tauri-args: --bundles deb
            app: target/release/brigadier
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.rust-targets }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.name }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Clippy (whole workspace, including the app shell)
        run: |
          pnpm build
          pnpm --filter @brigadier/desktop stage-sidecar --debug
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Build the app bundle
        # Signing and notarization use the APPLE_* secrets when they are configured; without
        # them the bundle is built unsigned. Empty variables must not be exported: the bundler
        # treats a set-but-empty certificate as one to import.
        env:
          SECRET_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          SECRET_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SECRET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          SECRET_APPLE_ID: ${{ secrets.APPLE_ID }}
          SECRET_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          SECRET_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            secret="SECRET_$name"
            if [ -n "${!secret}" ]; then export "$name=${!secret}"; fi
          done
          pnpm tauri build ${{ matrix.tauri-args }}

      - name: Launch smoke check
        run: |
          smoke() {
            if [ "$RUNNER_OS" = "Linux" ]; then
              # A desktop session has a D-Bus session bus (the single-instance lock and the tray
              # use it); xvfb-run alone has none. Without DRI3, WebKitGTK needs the DMA-BUF
              # renderer off to draw at all.
              WEBKIT_DISABLE_DMABUF_RENDERER=1 dbus-run-session -- xvfb-run -a "${{ matrix.app }}" --smoke
            else
              "${{ matrix.app }}" --smoke
            fi
          }
          # The release build just used every core. On macOS wait for the host to settle before
          # each launch, with a cap so a persistently busy runner still runs and reports the
          # unchanged budgets. loadavg is normalized by the runner's actual CPU count.
          wait_for_idle() {
            if [ "$RUNNER_OS" != "macOS" ]; then return; fi
            local elapsed=0 load
            while true; do
              load="$(node -p 'require("node:os").loadavg()[0] / require("node:os").cpus().length')"
              if awk -v load="$load" 'BEGIN { exit !(load < 0.75) }'; then
                echo "macOS 1-minute load/core $load (< 0.75) after ${elapsed}s"
                return
              fi
              if [ "$elapsed" -ge 120 ]; then
                echo "macOS 1-minute load/core $load still >= 0.75 after ${elapsed}s; running with diagnostics"
                return
              fi
              sleep 10
              elapsed=$((elapsed + 10))
            done
          }
          diagnostics() {
            echo "Runner snapshot before $1: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            if [ "$RUNNER_OS" = "Windows" ]; then
              # $_ is PowerShell's current process, not a shell variable.
              # shellcheck disable=SC2016
              powershell.exe -NoProfile -Command 'Get-CimInstance Win32_PerfFormattedData_PerfProc_Process | Where-Object { $_.Name -ne "_Total" -and $_.Name -ne "Idle" } | Sort-Object PercentProcessorTime -Descending | Select-Object -First 12 Name,IDProcess,PercentProcessorTime,WorkingSetPrivate | Format-Table -AutoSize' || true
            elif [ "$RUNNER_OS" = "macOS" ]; then
              uptime
              ps -Ao pid,ppid,%cpu,%mem,comm -r | head -n 16 || true
            else
              uptime
              ps -Ao pid,ppid,%cpu,%mem,comm --sort=-%cpu | head -n 16 || true
            fi
          }
          if [ "$RUNNER_OS" = "macOS" ]; then
            # GitHub's disposable macOS VM permits sudo. Stop Spotlight indexing during the
            # timed launches; a failure is visible but does not bypass smoke validation.
            sudo -n mdutil -a -i off || echo "Spotlight indexing could not be disabled"
          fi
          # Two throwaway launches prime loader and webview caches, including WebView2 on
          # Windows. Each uses a fresh data directory and prints its own smoke report.
          for warmup in 1 2; do
            echo "::group::Warm-up launch $warmup (not judged)"
            wait_for_idle
            diagnostics "warm-up $warmup"
            if BRIGADIER_DATA_DIR="$RUNNER_TEMP/brigadier-warmup-$warmup" \
              BRIGADIER_SMOKE_REPORT="$RUNNER_TEMP/warmup-report-$warmup.json" smoke; then
              echo "Warm-up $warmup completed"
            else
              echo "Warm-up $warmup exited nonzero; judged launches will still run"
            fi
            echo "::endgroup::"
          done
          # Then three pairs of launches: a first launch on a new data directory, then a second
          # launch on the same directory, each judged against its own startup budget. On shared
          # runners the window and webview creation before the page loads swings by seconds
          # between identical launches, so each startup budget is judged by the median of its
          # three launches against the same limit; every other check is judged on the first
          # launch, as the app judged it.
          launches=()
          for pair in 1 2 3; do
            for kind in first second; do
              echo "::group::Judged launch $pair ($kind on its data directory)"
              wait_for_idle
              diagnostics "judged launch $pair $kind"
              report="$RUNNER_TEMP/smoke-launch-$pair-$kind.json"
              launches+=("$report")
              if BRIGADIER_DATA_DIR="$RUNNER_TEMP/brigadier-smoke-$pair" \
                BRIGADIER_SMOKE_REPORT="$report" smoke; then
                echo "Judged launch $pair $kind completed"
              else
                echo "Judged launch $pair $kind exited nonzero; its report will still be judged"
              fi
              echo "::endgroup::"
            done
          done
          node apps/desktop/scripts/judge-smoke.mjs "$RUNNER_TEMP/smoke-report.json" "${launches[@]}"

      - name: Smoke report
        if: always()
        run: cat "${{ runner.temp }}/smoke-report.json" || echo "no smoke report was written"

      - name: No processes left behind
        if: always()
        run: |
          sleep 2
          if [ "$RUNNER_OS" = "Windows" ]; then
            if tasklist //FI "IMAGENAME eq brigadierd.exe" | grep -qi brigadierd; then
              echo "brigadierd is still running"; exit 1
            fi
          elif pgrep -fl brigadierd; then
            echo "brigadierd is still running"; exit 1
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-report-${{ matrix.name }}
          path: ${{ runner.temp }}/smoke-report.json
          if-no-files-found: warn
